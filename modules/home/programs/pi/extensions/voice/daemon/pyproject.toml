[project]
name = "pi-voice"
version = "0.1.0"
description = "Voice calls with Pi: the local daemon (turn detection, STT, TTS) behind the voice extension"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx>=0.32",
  # Voxtral TTS and Qwen3-ASR's modules (VoxTurn's backbone); pinned to the commit measured in phase 1.
  "mlx-audio @ git+https://github.com/Blaizzy/mlx-audio.git@3e2368ef96e686ad6c2c8791272bd25617d3e71e",
  "mlx-whisper>=0.4.3",
  "mistral-common[audio]>=1.8",
  "numpy>=1.26",
  "onnxruntime>=1.20",
  "soundfile>=0.12",
  "tokenizers>=0.21",
  "huggingface_hub>=0.34",
]

[project.scripts]
pi-voice = "pi_voice.__main__:main"
pi-voice-fake-audio = "pi_voice.fake_audio:main"

[dependency-groups]
dev = ["pytest>=8", "jiwer>=3", "peft>=0.15", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs model weights from the HF cache (slow)"]
